{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<h1>Change password</h1>
<form method="post" class="card form narrow">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
  <label>New password <input name="new" type="password" autocomplete="new-password" minlength="8" required></label>
  <label>New password again <input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
  <button class="btn primary">Save</button>
</form>
{% endblock %}
