<section class="card push-card" id="push-card" data-vapid="{{ vapid_public }}" hidden>
  <h2>A reminder, when you want one.</h2><p class="muted small">Only reminders you choose. This setting applies to this device.</p>
  <p id="push-status" class="small" role="status"></p>
  <div class="actions"><button type="button" class="btn primary" id="push-on" hidden>Enable notifications</button><button type="button" class="btn" id="push-test" hidden>Send a test</button><button type="button" class="btn" id="push-off" hidden>Turn off</button></div>
</section>
