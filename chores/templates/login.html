{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block main_class %}login-wrap{% endblock %}
{% block content %}
<form method="post" class="login card">
  <div class="login-mark">✓</div>
  <h1>chores</h1>
  <p class="muted">moll.casa household</p>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Username <input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary wide">Log in</button>
</form>
{% endblock %}
