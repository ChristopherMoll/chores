name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 = Raspberry Pi OS Bookworm; newest for early warning
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.13" }
          # What the Pi actually runs: Windows 11 on ARM64
          - { os: windows-latest, python-version: "3.13" }
          - { os: windows-11-arm, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install --prefer-binary -r requirements-dev.txt
      - run: pytest -q
